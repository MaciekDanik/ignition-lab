name: ignition-lab

services:
  ignition-test:
    image: inductiveautomation/ignition:${IGNITION_VERSION:-8.3.9}
    container_name: ignition-test
    hostname: ignition-test
    restart: unless-stopped

    depends_on:
      ignition-postgres:
        condition: service_healthy

    ports:
      - "9088:8088"

    environment:
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD_FILE: /run/secrets/gateway_admin_password
      IGNITION_EDITION: standard
      TZ: ${TZ:-Europe/Warsaw}

    command:
      - -n
      - ignition-test
      - -m
      - "1536"
      - --
      - -Dignition.config.mode=test

    volumes:
      # Gateway runtime state, including its internal database.
      - ignition-test-data:/usr/local/bin/ignition/data

      # Repository-managed Ignition 8.3 resources.
      - ${TEST_PROJECTS_PATH:-../projects}:/usr/local/bin/ignition/data/projects
      - ../runtime/test/config/resources:/usr/local/bin/ignition/data/config/resources

      - ${TEST_GATEWAY_CONFIG_ROOT:-../config/gateway/resources/core}/com.inductiveautomation.opcua/device:/usr/local/bin/ignition/data/config/resources/core/com.inductiveautomation.opcua/device

      - ${TEST_GATEWAY_CONFIG_ROOT:-../config/gateway/resources/core}/ignition/tag-provider:/usr/local/bin/ignition/data/config/resources/core/ignition/tag-provider

      - ${TEST_GATEWAY_CONFIG_ROOT:-../config/gateway/resources/core}/ignition/tag-group:/usr/local/bin/ignition/data/config/resources/core/ignition/tag-group

      - ${TEST_GATEWAY_CONFIG_ROOT:-../config/gateway/resources/core}/ignition/tag-definition:/usr/local/bin/ignition/data/config/resources/core/ignition/tag-definition

      - ${TEST_GATEWAY_CONFIG_ROOT:-../config/gateway/resources/core}/ignition/tag-type-definition:/usr/local/bin/ignition/data/config/resources/core/ignition/tag-type-definition

      - ${TEST_GATEWAY_CONFIG_ROOT:-../config/gateway/resources/core}/ignition/database-connection:/usr/local/bin/ignition/data/config/resources/core/ignition/database-connection

      - ${TEST_GATEWAY_CONFIG_ROOT:-../config/gateway/resources/core}/ignition/images:/usr/local/bin/ignition/data/config/resources/core/ignition/images

      # Local password file, never committed.
      - ../secrets/test_gateway_admin_password.txt:/run/secrets/gateway_admin_password:ro

      # Git-backed Deployment Mode collections.
      - ${TEST_GATEWAY_RESOURCES_ROOT:-../config/gateway/resources}/test:/usr/local/bin/ignition/data/config/resources/test
      - ${TEST_GATEWAY_RESOURCES_ROOT:-../config/gateway/resources}/dev:/usr/local/bin/ignition/data/config/resources/dev
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8088/StatusPing
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    mem_limit: 2200m
    cpus: 2.0

  ignition-dev:
    image: inductiveautomation/ignition:${IGNITION_VERSION:-8.3.9}
    container_name: ignition-dev
    hostname: ignition-dev
    restart: unless-stopped

    depends_on:
      ignition-postgres:
        condition: service_healthy

    ports:
      - "9188:8088"

    environment:
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD_FILE: /run/secrets/gateway_admin_password
      IGNITION_EDITION: standard
      TZ: ${TZ:-Europe/Warsaw}

    command:
      - -n
      - ignition-dev
      - -m
      - "1536"
      - --
      - -Dignition.config.mode=dev

    volumes:
      # Gateway runtime state, including its internal database.
      - ignition-dev-data:/usr/local/bin/ignition/data

      # Repository-managed Ignition 8.3 resources.
      - ${DEV_PROJECTS_PATH:-../services/ignition-dev/projects}:/usr/local/bin/ignition/data/projects
      - ${DEV_CONFIG_RESOURCES_PATH:-../services/ignition-dev/config/resources}:/usr/local/bin/ignition/data/config/resources

      # Local password file, never committed.
      - ../secrets/dev_gateway_admin_password.txt:/run/secrets/gateway_admin_password:ro

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8088/StatusPing
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    mem_limit: 2200m
    cpus: 2.0

  ignition-postgres:
    image: postgres:16.15-bookworm
    container_name: ignition-postgres
    hostname: ignition-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ignition_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      TZ: ${TZ:-Europe/Warsaw}

    volumes:
      - ignition-postgres-data:/var/lib/postgresql/data
      - ./postgres-init/01-create-ignition-databases.sh:/docker-entrypoint-initdb.d/01-create-ignition-databases.sh:ro
      - ../secrets/postgres_admin_password.txt:/run/secrets/postgres_admin_password:ro
      - ../secrets/postgres_test_password.txt:/run/secrets/postgres_test_password:ro
      - ../secrets/postgres_dev_password.txt:/run/secrets/postgres_dev_password:ro

    healthcheck:
      test: 
        - CMD-SHELL
        - pg_isready -U ignition_admin -d postgres
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    mem_limit: 768m
    cpus: 1.0

volumes:
  ignition-test-data:
    name: ignition-test-data
  
  ignition-dev-data:
    name: ignition-dev-data

  ignition-postgres-data:
    name: ignition-postgres-data
